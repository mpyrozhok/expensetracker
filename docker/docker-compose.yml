# Local containerized run:
#
#   cd docker
#   cp .env.example .env      # then fill in SESSION_SECRET
#   docker compose up -d --build
#   open http://localhost:8787
#
# Compose interpolates this file for every subcommand, `ps` and `logs`
# included, which is why the variables live in .env rather than in front of
# one command.
#
# On Debian/Ubuntu the packaged compose (2.37) drives `buildx bake` with a
# --metadata-file flag the packaged buildx (0.5.1) rejects; prefix the build
# with COMPOSE_BAKE=0, or run `docker buildx build --load` from the repository
# root, which needs no flag.
#
# The app is single-origin: Express serves the API, the WebSocket upgrade on
# /ws and the compiled SPA, so no reverse proxy or CORS setup is needed.
#
# Real SSO: put GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET (and/or the
# GitHub pair) in a docker/.env file beside this compose file, one per
# line, unquoted, and stop setting ALLOW_MOCK_AUTH.
#
# Without credentials, set ALLOW_MOCK_AUTH=1 and use the "SSO stub" form
# on the sign-in screen: same provisioning path, no network call.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: expense-tracker:local
    restart: unless-stopped
    ports:
      - '${PORT:-8787}:8787'
    environment:
      # Required. Generate with: openssl rand -hex 32
      SESSION_SECRET: '${SESSION_SECRET:?required}'
      # Must match the browser origin: the post-login redirect is
      # allow-listed against this value.
      FRONTEND_ORIGIN: '${FRONTEND_ORIGIN:-http://localhost:8787}'
      DATABASE_PATH: /data/app.db
      ALLOW_MOCK_AUTH: '${ALLOW_MOCK_AUTH:-0}'
      # SSO credentials; see the README for how to obtain them.
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID:-}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET:-}'
      GITHUB_CLIENT_ID: '${GITHUB_CLIENT_ID:-}'
      GITHUB_CLIENT_SECRET: '${GITHUB_CLIENT_SECRET:-}'
      # The callback defaults to the port the app listens on INSIDE the
      # container (8787); the host-side mapping above does not change it.
      # Published on any other host port, the provider is told to return to
      # 8787 and the callback fails with a redirect_uri mismatch, so when
      # PORT is not 8787 set both to the URI you registered:
      #   http://localhost:${PORT}/api/auth/<provider>/callback
      # Present-but-empty means unset here, so leaving these blank is safe.
      GOOGLE_REDIRECT_URI: '${GOOGLE_REDIRECT_URI:-}'
      GITHUB_REDIRECT_URI: '${GITHUB_REDIRECT_URI:-}'
    volumes:
      # SQLite runs in WAL mode, so the directory itself is the state.
      - expense-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8787/api/health')
            .then(r=>process.exit(r.ok?0:1))
            .catch(()=>process.exit(1))
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  expense-data:
